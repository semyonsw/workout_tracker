# Build the release APK on a `v*` tag and attach it to a GitHub Release.
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────
#
# The APK used to be COMMITTED to the repo root, and .gitignore explained why:
# update the phone straight from GitHub with no build machine. That is a sound
# goal and an expensive mechanism — 30 MB per release, in git history, forever,
# cloned by everybody who ever touches the repo. A GitHub Release is the same
# download from the same place, and it does not live in history.
#
# ── WHAT IT NEEDS FROM YOU ─────────────────────────────────────────────────
#
# The signing keystore, as four repository secrets. Android identifies an app by
# package name + signing key, so an APK signed with anything other than the real
# keystore CANNOT update an existing install — Android refuses, and the only way
# through is an uninstall, which deletes the workout history. Getting these right
# is the difference between an update and a data loss.
#
#   ANDROID_KEYSTORE_BASE64   the keystore file, base64-encoded
#   ANDROID_STORE_PASSWORD    its store password
#   ANDROID_KEY_ALIAS         the key alias inside it
#   ANDROID_KEY_PASSWORD      that key's password
#
# Encode the keystore with (PowerShell, on the machine that has it):
#
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("workout-tracker-release.keystore")) > keystore.b64
#
# ...then paste the contents of keystore.b64 into the secret. Nothing resembling a
# key, a password or an alias is in this file or anywhere else in this repo, and
# BUILD_ANDROID.md's Signing section is the authority on where the real keystore
# lives and why losing it costs an uninstall.
#
# WITHOUT THE SECRETS this job fails at the signing step rather than quietly
# producing a debug-signed APK. `plugins/withReleaseSigning.js` falls back to the
# debug key for a local build so a fresh clone still runs, which is right for a
# laptop and exactly wrong for a release: an APK that looks shippable and cannot
# update anybody's install is worse than no APK.
name: Release APK

on:
  push:
    tags:
      - 'v*'

# Needed to create the release and upload the asset.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The APK ships a compiled JS bundle, so the tests are the last chance to
      # find out that the thing being shipped is broken.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # `android/` is generated output, not source (see .gitignore), so it is
      # generated here from app.json — which is the source of truth for the
      # version, the permissions and the config plugins.
      - name: Generate the native project
        run: npx expo prebuild -p android --no-install

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. A release APK signed with the"
            echo "debug key cannot update an existing install, so this fails rather"
            echo "than shipping one. See the header of this workflow."
            exit 1
          fi
          # Outside the workspace, so nothing can sweep it into an artifact.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        env:
          WT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        # The same property names `plugins/withReleaseSigning.js` reads, passed as
        # Gradle properties rather than written into a file. arm64 only: it is the
        # only architecture any phone this is sideloaded onto has, and a universal
        # APK is twice the size for nothing.
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PWT_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PWT_STORE_PASSWORD="$WT_STORE_PASSWORD" \
            -PWT_KEY_ALIAS="$WT_KEY_ALIAS" \
            -PWT_KEY_PASSWORD="$WT_KEY_PASSWORD"

      # Named for the version, because the file lands in a Downloads folder next
      # to every previous one and "app-release.apk" is four identical files.
      - name: Name the APK for its version
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="workout-tracker-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          # A draft, deliberately: the release notes are the "what changed on the
          # phone" section of BUILD_ANDROID.md, written by a human who knows what
          # changed. A tag should not publish prose nobody wrote.
          draft: true
          name: ${{ github.ref_name }}
          body: |
            Sideloadable release APK for arm64 Android.

            Install: download the `.apk`, open it in **Files**, tap install.
            See BUILD_ANDROID.md for the first-launch notification and battery
            settings, which the timers depend on.

            **Before installing, export a backup** from
            `Settings → Export data`. An APK signed with a different key cannot
            update an existing install.
